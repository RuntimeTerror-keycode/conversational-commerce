name: Typecheck

on:
  pull_request:
    branches: [main, dev]

jobs:
  typecheck-api:
    name: tsc --noEmit (apps/api)
    runs-on: ubuntu-latest
    container: node:22-bookworm-slim
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npx tsc --noEmit
