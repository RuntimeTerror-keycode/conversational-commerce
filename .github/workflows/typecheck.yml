name: Typecheck

on:
  pull_request:
    branches: [main, dev]

jobs:
  typecheck-api:
    name: tsc --noEmit (apps/api)
    runs-on: ubuntu-latest
    container: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable && corepack prepare pnpm@latest --activate
      - run: pnpm install
      - run: pnpm --filter @cc/domain exec tsc --noEmit
      - run: pnpm --filter backend exec tsc --noEmit
