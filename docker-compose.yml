services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kadakaran
      POSTGRES_PASSWORD: kadakaran
      POSTGRES_DB: kadakaran
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docs/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docs/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: kadakaran
      RABBITMQ_DEFAULT_PASS: kadakaran
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  edge:
    build:
      context: .
      dockerfile: apps/edge/Dockerfile
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
      - path: apps/edge/.env
        required: false
    environment:
      AGENT_TURN_URL: ${EDGE_AGENT_TURN_URL:-http://host.docker.internal:4111/agent/turn}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  rabbitmq_data: