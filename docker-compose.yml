services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cc
      POSTGRES_PASSWORD: cc
      POSTGRES_DB: cc
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  edge:
    build:
      context: .
      dockerfile: apps/edge/Dockerfile
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
      - path: apps/edge/.env
        required: false
    environment:
      # Agent still runs on the host in the walking skeleton.
      AGENT_TURN_URL: ${EDGE_AGENT_TURN_URL:-http://host.docker.internal:4111/agent/turn}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
